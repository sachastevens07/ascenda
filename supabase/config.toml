# Minimal Supabase CLI config for Edge Functions.
# SQL is still pasted by hand (see supabase/*.sql). Do not put secrets here.
project_id = "ascenda"

[functions.exercise-media]
enabled = true
verify_jwt = true
entrypoint = "./functions/exercise-media/index.ts"

[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"

[functions.scan-machine]
enabled = true
verify_jwt = true
entrypoint = "./functions/scan-machine/index.ts"
static_files = [ "./functions/scan-machine/prompt.md" ]

[functions.monthly-recap]
enabled = true
verify_jwt = true
entrypoint = "./functions/monthly-recap/index.ts"
static_files = [ "./functions/monthly-recap/prompt.md" ]

[functions.what-can-i-cook]
enabled = true
verify_jwt = true
entrypoint = "./functions/what-can-i-cook/index.ts"
static_files = [
  "./functions/what-can-i-cook/prompt.md",
  "./functions/what-can-i-cook/ingredients.json",
  "./functions/what-can-i-cook/recipes.json",
]

[functions.busy-gym-fix]
enabled = true
verify_jwt = true
entrypoint = "./functions/busy-gym-fix/index.ts"
static_files = [ "./functions/busy-gym-fix/prompt.md" ]

[functions.build-session]
enabled = true
verify_jwt = true
entrypoint = "./functions/build-session/index.ts"
static_files = [ "./functions/build-session/prompt.md" ]

[functions.ask-ascenda]
enabled = true
verify_jwt = true
entrypoint = "./functions/ask-ascenda/index.ts"
static_files = [ "./functions/ask-ascenda/prompt.md" ]
